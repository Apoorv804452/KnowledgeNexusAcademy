<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge Nexus Academy – Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b1a2e, #1a2f3f, #0e2635);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ---------- CONTAINER ---------- */
        .auth-container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 35px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s ease;
        }

        /* ---------- HEADER ---------- */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f6b26b, #e08a3a);
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(224, 138, 58, 0.35);
            font-size: 36px;
            color: #fff;
        }

        .auth-header h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .auth-header .academy-sub {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
            margin-top: 6px;
        }

        /* ---------- TOGGLE TABS ---------- */
        .toggle-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 4px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .toggle-tabs button {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .toggle-tabs button.active {
            background: linear-gradient(135deg, #f6b26b, #e08a3a);
            color: #0b1a2e;
            box-shadow: 0 4px 16px rgba(224, 138, 58, 0.3);
        }

        .toggle-tabs button:hover:not(.active) {
            color: rgba(255, 255, 255, 0.8);
        }

        /* ---------- FORMS ---------- */
        .auth-form {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            transition: 0.3s ease;
        }

        .form-group .input-wrapper input,
        .form-group .input-wrapper select {
            width: 100%;
            padding: 14px 44px 14px 46px;
            background: rgba(255, 255, 255, 0.07);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: 0.3s ease;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        .form-group .input-wrapper select {
            padding-right: 46px;
            cursor: pointer;
        }
        .form-group .input-wrapper select option {
            background: #1a2f3f;
            color: #fff;
        }

        .form-group .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-group .input-wrapper input:focus,
        .form-group .input-wrapper select:focus {
            border-color: #f6b26b;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(224, 138, 58, 0.15);
        }

        .form-group .input-wrapper input:focus+i,
        .form-group .input-wrapper select:focus+i {
            color: #f6b26b;
        }

        .form-group .input-wrapper .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s ease;
            padding: 4px;
        }

        .form-group .input-wrapper .toggle-password:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ---------- FORM OPTIONS ---------- */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 2px 0 4px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            accent-color: #e08a3a;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .form-options a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .form-options a:hover {
            color: #f6b26b;
        }

        /* ---------- SUBMIT BUTTON ---------- */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f6b26b, #e08a3a);
            border: none;
            border-radius: 16px;
            color: #0b1a2e;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(224, 138, 58, 0.4);
        }

        .btn-submit:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(11, 26, 46, 0.3);
            border-top-color: #0b1a2e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-submit.loading .spinner {
            display: block;
        }
        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- DIVIDER ---------- */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 8px 0 4px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ---------- SOCIAL BUTTONS ---------- */
        .social-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .social-buttons button {
            flex: 1;
            padding: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .social-buttons button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .social-buttons button i {
            font-size: 18px;
        }

        /* ---------- MESSAGES ---------- */
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .message.show {
            display: flex;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .message.success {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .message i {
            font-size: 16px;
        }

        /* ---------- WELCOME SCREEN ---------- */
        .welcome-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px 0 10px;
        }

        .welcome-screen.show {
            display: flex;
        }

        .welcome-screen .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f6b26b, #e08a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #0b1a2e;
            margin-bottom: 20px;
            box-shadow: 0 8px 28px rgba(224, 138, 58, 0.3);
        }

        .welcome-screen h2 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
        }

        .welcome-screen .academy-name {
            color: #f6b26b;
            font-weight: 600;
        }

        .welcome-screen p {
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            font-size: 15px;
        }

        .welcome-screen .user-email {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 20px;
            border-radius: 60px;
            margin: 12px 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-logout {
            padding: 12px 36px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 60px;
            color: #f87171;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.35);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .auth-container {
                padding: 28px 20px;
                border-radius: 24px;
            }

            .auth-header h1 {
                font-size: 22px;
            }

            .toggle-tabs button {
                font-size: 14px;
                padding: 8px 0;
            }

            .form-group .input-wrapper input,
            .form-group .input-wrapper select {
                padding: 12px 40px 12px 42px;
                font-size: 14px;
            }

            .social-buttons button {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container" id="app">

        <!-- ===== HEADER ===== -->
        <div class="auth-header">
            <div class="logo-wrapper">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1>Knowledge Nexus</h1>
            <div class="academy-sub">Academy</div>
            <p id="subtitle">From confusion to clarity</p>
        </div>

        <!-- ===== TOGGLE TABS ===== -->
        <div class="toggle-tabs" id="toggleTabs">
            <button class="active" data-tab="login">Sign In</button>
            <button data-tab="signup">Create Account</button>
        </div>

        <!-- ===== MESSAGE ===== -->
        <div class="message" id="message">
            <i class="fas fa-circle-exclamation"></i>
            <span id="messageText">Error message</span>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form class="auth-form active" id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input
                    type="email"
                    id="loginEmail"
                    placeholder="student@example.com"
                    required
                    />
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                    />
                    <button type="button" class="toggle-password" data-target="loginPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" checked /> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="spinner"></span>
            </button>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-buttons">
                <button type="button" id="googleLogin">
                    <i class="fab fa-google"></i> Google
                </button>
            </div>
        </form>

        <!-- ===== SIGNUP FORM ===== -->
        <form class="auth-form" id="signupForm" autocomplete="off">
            <div class="form-group">
                <label for="signupName">Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input
                    type="text"
                    id="signupName"
                    placeholder="e.g., Riya Sharma"
                    required
                    />
                </div>
            </div>

            <div class="form-group">
                <label for="signupClass">Class / Grade</label>
                <div class="input-wrapper">
                    <i class="fas fa-chalkboard-user"></i>
                    <select id="signupClass" required>
                        <option value="">Select your class</option>
                        <option value="1">Class 1</option>
                        <option value="2">Class 2</option>
                        <option value="3">Class 3</option>
                        <option value="4">Class 4</option>
                        <option value="5">Class 5</option>
                        <option value="6">Class 6</option>
                        <option value="7">Class 7</option>
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10">Class 10</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    required
                    />
                </div>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input
                    type="password"
                    id="signupPassword"
                    placeholder="Min 6 characters"
                    required
                    minlength="6"
                    />
                    <button type="button" class="toggle-password" data-target="signupPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="signupBtn">
                <span class="btn-text">Create Account</span>
                <span class="spinner"></span>
            </button>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-buttons">
                <button type="button" id="googleSignup">
                    <i class="fab fa-google"></i> Google
                </button>
            </div>
        </form>

        <!-- ===== WELCOME SCREEN ===== -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="avatar">
                <i class="fas fa-user-check"></i>
            </div>
            <h2>Welcome to <span class="academy-name">Knowledge Nexus</span></h2>
            <p>Your journey from confusion to clarity begins here</p>
            <div class="user-email" id="userEmailDisplay">user@example.com</div>
            <button class="btn-logout" id="logoutBtn">
                <i class="fas fa-sign-out-alt" style="margin-right:8px;"></i>Sign Out
            </button>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- FIREBASE (compat v9)                                          -->
    <!-- ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>

    <script>
        // ================================================================
        // 1.  FIREBASE CONFIG – YOUR PROJECT DETAILS
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBL2OiW6f1PCbiFMSqyPuhPnfa1d0ywGKc",
            authDomain: "knowledgenexusacademy-a2550.firebaseapp.com",
            projectId: "knowledgenexusacademy-a2550",
            storageBucket: "knowledgenexusacademy-a2550.firebasestorage.app",
            messagingSenderId: "365793429570",
            appId: "1:365793429570:web:167e16259d0835042785db",
            measurementId: "G-8SZQQZE847"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ================================================================
        // 2.  DOM REFS
        // ================================================================
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const toggleTabs = document.getElementById('toggleTabs');
        const messageEl = document.getElementById('message');
        const messageText = document.getElementById('messageText');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const subtitle = document.getElementById('subtitle');

        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');

        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const signupName = document.getElementById('signupName');
        const signupClass = document.getElementById('signupClass');
        const signupEmail = document.getElementById('signupEmail');
        const signupPassword = document.getElementById('signupPassword');

        // ================================================================
        // 3.  HELPERS
        // ================================================================
        function showMessage(text, type = 'error') {
            messageEl.className = `message show ${type}`;
            messageText.textContent = text;
            clearTimeout(messageEl._hideTimer);
            messageEl._hideTimer = setTimeout(() => {
                messageEl.classList.remove('show');
            }, 5000);
        }

        function hideMessage() {
            messageEl.classList.remove('show');
            clearTimeout(messageEl._hideTimer);
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function setActiveTab(tab) {
            document.querySelectorAll('.toggle-tabs button').forEach(b => b.classList.remove('active'));
            document.querySelector(`.toggle-tabs button[data-tab="${tab}"]`).classList.add('active');

            if (tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                document.querySelector('.auth-header h1').textContent = 'Knowledge Nexus';
                subtitle.textContent = 'From confusion to clarity';
            } else {
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
                document.querySelector('.auth-header h1').textContent = 'Join Knowledge Nexus';
                subtitle.textContent = 'Start your clarity journey today';
            }
            hideMessage();
        }

        function showWelcome(user) {
            document.querySelector('.auth-header').style.display = 'none';
            toggleTabs.style.display = 'none';
            loginForm.classList.remove('active');
            signupForm.classList.remove('active');
            welcomeScreen.classList.add('show');
            userEmailDisplay.textContent = user.email || 'No email';
            hideMessage();
        }

        function showAuthForms() {
            document.querySelector('.auth-header').style.display = 'block';
            toggleTabs.style.display = 'flex';
            welcomeScreen.classList.remove('show');
            setActiveTab('login');
        }

        // ================================================================
        // 4.  TOGGLE PASSWORD VISIBILITY
        // ================================================================
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const input = document.getElementById(targetId);
                if (!input) return;
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        });

        // ================================================================
        // 5.  TAB SWITCHING
        // ================================================================
        toggleTabs.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const tab = btn.dataset.tab;
            if (!tab) return;
            setActiveTab(tab);
        });

        // ================================================================
        // 6.  AUTH STATE OBSERVER
        // ================================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                showWelcome(user);
            } else {
                showAuthForms();
            }
        });

        // ================================================================
        // 7.  LOGIN
        // ================================================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }
            setLoading(loginBtn, true);
            try {
                await auth.signInWithEmailAndPassword(email, password);
                showMessage('Signed in successfully!', 'success');
            } catch (err) {
                let msg = err.message;
                if (err.code === 'auth/user-not-found') msg = 'No account found with this email.';
                else if (err.code === 'auth/wrong-password') msg = 'Incorrect password.';
                else if (err.code === 'auth/invalid-email') msg = 'Invalid email address.';
                else if (err.code === 'auth/too-many-requests') msg = 'Too many attempts. Try again later.';
                showMessage(msg, 'error');
            } finally {
                setLoading(loginBtn, false);
            }
        });

        // ================================================================
        // 8.  SIGNUP (with class selection)
        // ================================================================
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const name = signupName.value.trim();
            const cls = signupClass.value;
            const email = signupEmail.value.trim();
            const password = signupPassword.value;

            if (!name || !cls || !email || !password) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters.', 'error');
                return;
            }

            setLoading(signupBtn, true);
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await cred.user.updateProfile({
                    displayName: `${name} (Class ${cls})`
                });
                showMessage('Account created successfully!', 'success');
            } catch (err) {
                let msg = err.message;
                if (err.code === 'auth/email-already-in-use') msg = 'Email already in use.';
                else if (err.code === 'auth/invalid-email') msg = 'Invalid email address.';
                else if (err.code === 'auth/weak-password') msg = 'Password is too weak.';
                showMessage(msg, 'error');
            } finally {
                setLoading(signupBtn, false);
            }
        });

        // ================================================================
        // 9.  SOCIAL LOGIN (Google only)
        // ================================================================
        function socialLogin(provider) {
            hideMessage();
            document.querySelectorAll('.social-buttons button').forEach(b => b.disabled = true);
            auth.signInWithPopup(provider)
                .then(() => {
                    showMessage('Signed in with Google', 'success');
                })
                .catch(err => {
                    let msg = err.message;
                    if (err.code === 'auth/popup-closed-by-user') msg = 'Popup closed before signing in.';
                    else if (err.code === 'auth/account-exists-with-different-credential') {
                        msg = 'An account already exists with a different sign-in method.';
                    }
                    showMessage(msg, 'error');
                })
                .finally(() => {
                    document.querySelectorAll('.social-buttons button').forEach(b => b.disabled = false);
                });
        }

        document.getElementById('googleLogin').addEventListener('click', () => {
            socialLogin(new firebase.auth.GoogleAuthProvider());
        });
        document.getElementById('googleSignup').addEventListener('click', () => {
            socialLogin(new firebase.auth.GoogleAuthProvider());
        });

        // ================================================================
        // 10. LOGOUT
        // ================================================================
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await auth.signOut();
                showMessage('Signed out.', 'success');
            } catch (err) {
                showMessage(err.message, 'error');
            }
        });

        // ================================================================
        // 11. INIT
        // ================================================================
        console.log('🔥 Knowledge Nexus Academy Auth UI ready!');
    </script>
</body>
</html>
