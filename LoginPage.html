<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Knowledge Nexus Academy</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(37, 99, 235, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(37, 99, 235, 0.06) 0%, transparent 50%);
        }
        .auth-card {
            background: #ffffff;
            max-width: 440px;
            width: 100%;
            padding: 2.5rem 2rem 2.2rem;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 20, 50, 0.10), 0 8px 24px rgba(0, 0, 0, 0.04);
        }
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #1e3a8a, #2563eb);
            border-radius: 18px;
            color: #fff;
            font-size: 2rem;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            margin-bottom: 0.75rem;
        }
        .brand h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0b1e3a;
            letter-spacing: -0.02em;
        }
        .brand h1 span {
            color: #2563eb;
        }
        .brand .tagline {
            font-size: 0.92rem;
            font-weight: 500;
            color: #64748b;
            margin-top: 0.2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e293b;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-wrap:focus-within {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
            background: #ffffff;
        }
        .input-wrap .icon {
            padding: 0 0 0 1.1rem;
            color: #94a3b8;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .input-wrap:focus-within .icon {
            color: #2563eb;
        }
        .input-wrap input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0.9rem 1rem 0.9rem 0.75rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #0b1e3a;
            outline: none;
        }
        .input-wrap input::placeholder {
            color: #aab4c9;
        }
        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(145deg, #1e3a8a, #2563eb);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.35);
        }
        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-submit.loading .spinner {
            display: inline-block;
        }
        .btn-submit.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .message {
            padding: 0.75rem 1rem;
            border-radius: 60px;
            font-size: 0.88rem;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .message.error {
            display: flex;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .message.success {
            display: flex;
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .message.info {
            display: flex;
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.6rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .auth-footer a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.8rem 1.2rem 1.6rem;
                border-radius: 1.5rem;
            }
            .brand h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
            <h1>Knowledge <span>Nexus</span></h1>
            <p class="tagline"><i class="fas fa-quote-left" style="color:#f59e0b;"></i> From Confusion to Clarity <i class="fas fa-quote-right" style="color:#f59e0b;"></i></p>
        </div>

        <div id="messageBox" class="message">
            <i class="fas fa-circle-info"></i>
            <span id="messageText">Message</span>
        </div>

        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-wrap">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required />
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrap">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="loginPassword" placeholder="••••••••" required />
                </div>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">
                <span class="btn-text"><i class="fas fa-arrow-right-to-bracket" style="margin-right:8px;"></i>Log In</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="auth-footer">
            &copy; 2026 <a href="#">Knowledge Nexus Academy</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const firebaseConfig = {
                apiKey: "AIzaSyBL2OiW6f1PCbiFMSqyPuhPnfa1d0ywGKc",
                authDomain: "knowledgenexusacademy-a2550.firebaseapp.com",
                projectId: "knowledgenexusacademy-a2550",
                storageBucket: "knowledgenexusacademy-a2550.firebasestorage.app",
                messagingSenderId: "365793429570",
                appId: "1:365793429570:web:167e16259d0835042785db",
                measurementId: "G-8SZQQZE847"
            };

            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            const loginEmail = document.getElementById('loginEmail');
            const loginPassword = document.getElementById('loginPassword');
            const loginBtn = document.getElementById('loginBtn');
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');

            let msgTimeout = null;

            function showMessage(text, type = 'info') {
                messageBox.className = 'message ' + type;
                messageText.textContent = text;
                clearTimeout(msgTimeout);
                msgTimeout = setTimeout(() => {
                    messageBox.className = 'message';
                }, 6000);
            }

            function setLoading(btn, isLoading) {
                if (isLoading) {
                    btn.classList.add('loading');
                    btn.disabled = true;
                } else {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                }
            }

            function validateEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // Check if user is already logged in
            auth.onAuthStateChanged(user => {
                if (user) {
                    // Check role
                    db.collection('users').doc(user.uid).get()
                        .then(doc => {
                            if (doc.exists) {
                                const role = doc.data().role;
                                if (role === 'teacher') {
                                    window.location.href = 'teacher-dashboard.html';
                                } else if (role === 'student') {
                                    window.location.href = 'student-dashboard.html';
                                } else {
                                    // Default to student
                                    window.location.href = 'student-dashboard.html';
                                }
                            } else {
                                // Try checking students collection
                                db.collection('students').doc(user.uid).get()
                                    .then(snap => {
                                        if (snap.exists) {
                                            window.location.href = 'student-dashboard.html';
                                        } else {
                                            window.location.href = 'student-dashboard.html';
                                        }
                                    })
                                    .catch(() => {
                                        window.location.href = 'student-dashboard.html';
                                    });
                            }
                        })
                        .catch(() => {
                            window.location.href = 'student-dashboard.html';
                        });
                }
            });

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = loginEmail.value.trim();
                const password = loginPassword.value.trim();

                if (!email || !validateEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    loginEmail.focus();
                    return;
                }
                if (!password || password.length < 6) {
                    showMessage('Password must be at least 6 characters.', 'error');
                    loginPassword.focus();
                    return;
                }

                setLoading(loginBtn, true);

                auth.signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        const user = userCredential.user;
                        setLoading(loginBtn, false);

                        // Check role
                        db.collection('users').doc(user.uid).get()
                            .then(doc => {
                                if (doc.exists) {
                                    const role = doc.data().role;
                                    if (role === 'teacher') {
                                        window.location.href = 'teacher-dashboard.html';
                                    } else {
                                        window.location.href = 'student-dashboard.html';
                                    }
                                } else {
                                    // Check if student exists
                                    db.collection('students').doc(user.uid).get()
                                        .then(snap => {
                                            if (snap.exists) {
                                                window.location.href = 'student-dashboard.html';
                                            } else {
                                                showMessage('Account not found. Please contact your teacher.',
                                                    'error');
                                            }
                                        })
                                        .catch(() => {
                                            window.location.href = 'student-dashboard.html';
                                        });
                                }
                            })
                            .catch(() => {
                                window.location.href = 'student-dashboard.html';
                            });
                    })
                    .catch((error) => {
                        setLoading(loginBtn, false);
                        let msg = error.message;
                        if (error.code === 'auth/user-not-found') {
                            msg = 'No account found with this email.';
                        } else if (error.code === 'auth/wrong-password') {
                            msg = 'Incorrect password. Please try again.';
                        } else if (error.code === 'auth/invalid-email') {
                            msg = 'Invalid email address.';
                        } else if (error.code === 'auth/too-many-requests') {
                            msg = 'Too many failed attempts. Please try again later.';
                        }
                        showMessage(msg, 'error');
                    });
            });

            // Enter key on password field
            loginPassword.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });

        })();
    </script>

</body>
</html>
